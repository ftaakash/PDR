_comment: 'Phase 1 de-risking corpus (experiment ID: kill_v1_phase1_n45). NEW experiment ID per README''s
  frozen-protocol rule -- kill_v1.yaml (the original 7-repo pilot) is left untouched as the frozen pilot
  record. Stratified, not a plain convenience-sample expansion: repos selected across lockfileVersion
  (v2 vs v3), dependency-tree size (package count at probe time), and monorepo-vs-single-package structure
  -- all three computed objectively from each repo''s own lockfile, not estimated or guessed. GitHub stars/creation-date
  were NOT used as strata: this session''s anonymous GitHub API quota was exhausted (60/hour) partway
  through metadata collection, so rather than mix verified and unverified popularity/age data, popularity/age
  stratification is deferred to Phase 3 (200-repo run), where an authenticated API budget should be arranged
  first.'
